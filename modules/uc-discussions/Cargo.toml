[package]
name = "uc-discussions"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false
description = "Durable SQLite storage primitives for CortexKit discussions."

[[bin]]
name = "ck-uc-discussions"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
cortexkit-role-agent-inbox = "0.1.0"
cortexkit-store-types = "0.2.2"
subc-protocol = "0.32.4"
subc-client-rs = "0.29.3"
subc-control = "0.31.0"
subc-transport = "0.13.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
subc-daemon = "0.36.6"
cortexkit-test-support = "0.1.3"
