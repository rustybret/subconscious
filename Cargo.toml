# UltraCreative subc modules: our own modules, supervised by the stock published
# ck-subc next to the CortexKit modules. Everything upstream (subc-* crates, the
# daemon, the CLI) comes from crates.io or the official installer, never from here.
[workspace]
resolver = "2"
members = [
    "modules/uc-discussions",
]

[profile.release]
# Cargo's default, stated on purpose: every module serves each connection in its own
# task, so under unwind a panic drops one request, not the module. Switching to abort
# would turn any reachable panic into a module outage and no test would fail.
panic = "unwind"
